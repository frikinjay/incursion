name: Build and Release Incursion

# Runs when started from the Actions tab, when a version tag (e.g. v2.7.0) is pushed, or when a commit pushed to main
# has the version in its title (e.g. "v2.9.0" or "v2.9.0: Reliable downloads"). The version is the one in package.json.
# Other commits, including ones that only bump the version, never build or release anything.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Read-only by default; only the release job can write.
permissions:
  contents: read

# One run per ref at a time so releases don't race.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to exact commits (the comment says which release).
jobs:
  # Skips the build and release when this version is already released.
  check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.release.outputs.published }}
      requested: ${{ steps.requested.outputs.requested }}
      title: ${{ steps.notes.outputs.title }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get Version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tags and manual runs always count. A branch push counts only when the title of its newest commit names this
      # version as a whole word, so v2.9.0 doesn't match v2.9.01 or v2.9.0-beta.
      - name: Check the Commit Title
        id: requested
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          title="${MESSAGE%%$'\n'*}"
          pattern="(^|[^[:alnum:].+-])${VERSION//./\\.}($|[^[:alnum:].+-])"
          if [ "$EVENT" != "push" ] || [[ "$REF" == refs/tags/* ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$title" | grep -Eq "$pattern"; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a release: the commit title doesn't contain $VERSION."
          fi

      - name: Look for an Existing Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already released. Bump the version in package.json to publish a new one."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # RELEASE_NOTES.md has a "# " section per version, newest first: the heading is the release title and the text
      # up to the next "# " heading its description. The heading must name this version as a whole word, so notes for
      # another version are never published by mistake. A release without its section stops here, before building.
      - name: Read Release Notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUESTED: ${{ steps.requested.outputs.requested }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          number="${VERSION#v}"
          pattern="(^|[^[:alnum:].+-])v?${number//./\\.}($|[^[:alnum:].+-])"
          start=""
          [ -f RELEASE_NOTES.md ] && start=$(grep -nE '^# ' RELEASE_NOTES.md | grep -E "$pattern" | head -n 1 | cut -d: -f1)
          title="" body=""
          if [ -n "$start" ]; then
            title=$(sed -n "${start}s/^# *//p" RELEASE_NOTES.md)
            body=$(tail -n +"$((start + 1))" RELEASE_NOTES.md | awk '/^# /{ exit } { print }' | sed -e '/./,$!d')
            # Drop the "---" separator and blank lines before the next section.
            while [[ "$body" == *$'\n---' || "$body" == '---' ]]; do body=$(printf '%s' "${body%---}"); done
          fi
          if [ -z "$body" ]; then
            if [ "$REQUESTED" = "true" ] && [ "$PUBLISHED" != "true" ]; then
              echo "::error::RELEASE_NOTES.md has no section for $VERSION. Add one whose heading names $number (e.g. \"# Incursion $number: ...\") and push again."
              exit 1
            fi
            title="Incursion $VERSION"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          delimiter="NOTES_$(openssl rand -hex 12)"
          { echo "notes<<$delimiter"; printf '%s\n' "$body"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          if [ -n "$body" ]; then echo "::notice::Release notes for $VERSION: \"$title\" ($(printf '%s\n' "$body" | wc -l) lines)"; fi

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.requested == 'true' && needs.check.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      # Windows: NSIS installer. macOS: one DMG for Intel and Apple Silicon (ad-hoc signed). Linux: AppImage and .deb.
      # --publish never: the release job below uploads the files.
      - name: Build Application
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: incursion-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Publish once, after every platform has built.
  release:
    name: Publish Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Write Release Notes
        env:
          NOTES: ${{ needs.check.outputs.notes }}
        run: printf '%s\n' "$NOTES" > notes.md

      - name: Download Builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Write Checksums
        working-directory: release
        run: sha256sum -- *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt

      # A signed record that these files were built by this workflow from this commit (gh attestation verify).
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.title }}
          body_path: notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
